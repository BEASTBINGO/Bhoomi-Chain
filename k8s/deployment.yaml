apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhoomichain-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bhoomichain-backend
  template:
    metadata:
      labels:
        app: bhoomichain-backend
    spec:
      containers:
        - name: backend
          image: bhoomichain-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              value: mongodb://mongodb:27017/bhoomichain
---
apiVersion: v1
kind: Service
metadata:
  name: bhoomichain-backend
spec:
  type: NodePort
  selector:
    app: bhoomichain-backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30050
